<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Hi-TESS WorkBench — 플랫폼 개요</title>
<style>
  @font-face{
    font-family:'Inter';
    src:url('assets/Inter-Variable.woff2') format('woff2-variations');
    font-weight:100 900; font-display:block;
  }
  @font-face{
    font-family:'SUIT';
    src:url('assets/SUIT-Variable.woff2') format('woff2-variations');
    font-weight:100 900; font-display:block;
  }

  :root{
    --trust-blue:#002554;
    --line:#e2e8f0;
    --ink-strong:#1e293b;
    --ink-muted:#64748b;
    --pointer:#94a3b8;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#ffffff; }
  body{
    font-family:'Inter','SUIT',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:1920px;
    height:1080px;
    position:relative;
    overflow:hidden;
    background:#ffffff;
    word-break:keep-all;
  }

  /* ===== Header: 로고(좌) + 한 줄 설명(우) ===== */
  .header{
    position:absolute; left:0; top:0; width:1920px; height:110px;
    background:var(--trust-blue);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 64px;
  }
  .logo{ width:340px; height:auto; display:block; }
  .tagline{
    font-size:22px;
    font-weight:700;
    color:#ffffff;
    letter-spacing:-0.01em;
    text-align:right;
  }

  /* ===== 캡션: 스크린샷 좌측 상단 라벨 ===== */
  .caption{
    position:absolute; left:335px; top:150px;
    font-size:20px;
    font-weight:700;
    color:var(--ink-strong);
    letter-spacing:-0.01em;
  }

  /* ===== 스크린샷 프레임 ===== */
  .shot-wrap{
    position:absolute; left:335px; top:270px; width:1250px;
  }
  .shot-wrap img.shot{
    display:block;
    width:100%;
    height:auto;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 28px -12px rgba(0,37,84,.22);
  }

  /* ===== 영역 강조 박스 (얇은 테두리 + 미세한 네이비 워시) ===== */
  .rb{
    position:absolute;
    border:1px solid rgba(100,116,139,.7);
    background:rgba(0,37,84,.035);
    border-radius:4px;
    pointer-events:none;
  }
  .rb-sidebar{   left:0%;    top:0%;     width:9.6%;  height:100%; }
  .rb-topbar{    left:0%;    top:0%;     width:100%;  height:5.2%; }
  .rb-overview{  left:29.8%; top:7.7%;   width:50.5%; height:9.5%; }
  .rb-cards{     left:9.6%;  top:25.7%;  width:90.4%; height:20.6%; }
  .rb-favorites{ left:9.6%;  top:48%;    width:90.4%; height:13.8%; }
  .rb-history{   left:9.6%;  top:63.8%;  width:90.4%; height:29.3%; }

  /* ===== 보안 마스킹: 서버 IP / 개인 IP 블러 ===== */
  .redact{
    position:absolute;
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    background:rgba(255,255,255,.32);
    border:1px solid rgba(255,255,255,.55);
    border-radius:4px;
  }
  .rd-serverchip{ left:82.5%; top:0.2%;  width:9%; height:5.6%; }
  .rd-myip{       left:72.5%; top:12.3%; width:7%; height:3.8%; }

  /* ===== 콜아웃: 0×0 앵커 + 점 + 리더 라인 + 라벨 ===== */
  .co{ position:absolute; width:0; height:0; }
  .co .dot{
    position:absolute; left:0; top:0;
    width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%;
    background:var(--trust-blue);
    box-shadow:0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.22);
    z-index:2;
  }
  .co .line{ position:absolute; background:var(--pointer); z-index:1; }
  .co .label{
    position:absolute;
    font-size:15px;
    font-weight:600;
    color:var(--ink-strong);
    line-height:1.3;
    white-space:nowrap;
    z-index:2;
  }

  .co-sidebar{ left:0%; top:20%; }
  .co-sidebar .line{ right:0; top:0; width:64px; height:1px; transform:translateY(-50%); }
  .co-sidebar .label{ right:72px; top:0; transform:translateY(-50%); text-align:right; }

  .co-topbar{ left:15%; top:0%; }
  .co-topbar .line{ left:0; bottom:0; width:1px; height:36px; transform:translateX(-50%); }
  .co-topbar .label{ left:0; bottom:44px; transform:translateX(-50%); text-align:center; }

  /* 배너는 상단 여백(공백)을 가로질러 위쪽으로 인출 — 실제 스크린샷 위 요소를 가리지 않음 */
  .co-overview{ left:55%; top:7.7%; }
  .co-overview .line{ left:0; bottom:0; width:1px; height:79px; transform:translateX(-50%); }
  .co-overview .label{ left:0; bottom:87px; transform:translateX(-50%); text-align:center; }

  .co-cards{ left:100%; top:36%; }
  .co-cards .line{ left:0; top:0; width:64px; height:1px; transform:translateY(-50%); }
  .co-cards .label{ left:72px; top:0; transform:translateY(-50%); text-align:left; }

  /* 즐겨찾기는 좌측 사이드바 폭을 가로질러 인출 — 우측 3개와 균형을 맞추기 위한 배치 */
  .co-favorites{ left:9.6%; top:55%; }
  .co-favorites .line{ right:0; top:0; width:184px; height:1px; transform:translateY(-50%); }
  .co-favorites .label{ right:192px; top:0; transform:translateY(-50%); text-align:right; }

  .co-history{ left:100%; top:78%; }
  .co-history .line{ left:0; top:0; width:64px; height:1px; transform:translateY(-50%); }
  .co-history .label{ left:72px; top:0; transform:translateY(-50%); text-align:left; }

  /* ===== 하단 기술 스택 한 줄 ===== */
  .stack{
    position:absolute; left:0; top:940px; width:1920px;
    text-align:center;
  }
  .stack-rule{
    width:120px; height:1px; background:var(--line);
    margin:0 auto 14px;
  }
  .stack-text{
    font-size:14px;
    font-weight:500;
    color:var(--ink-muted);
    letter-spacing:.02em;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="header">
    <img class="logo" src="assets/logo-lockup-white.png" alt="Hi-TESS WorkBench" />
    <div class="tagline">사내 통합 구조 해석 플랫폼</div>
  </div>

  <div class="caption">Dashboard — 로그인 직후 첫 화면</div>

  <div class="shot-wrap">
    <img class="shot" src="assets/shot-dashboard.png" alt="Hi-TESS WorkBench Dashboard 화면 캡처" />

    <!-- 영역 강조 박스 -->
    <div class="rb rb-sidebar"></div>
    <div class="rb rb-topbar"></div>
    <div class="rb rb-overview"></div>
    <div class="rb rb-cards"></div>
    <div class="rb rb-favorites"></div>
    <div class="rb rb-history"></div>

    <!-- 보안 마스킹 (서버 IP·개인 IP 블러) -->
    <div class="redact rd-serverchip"></div>
    <div class="redact rd-myip"></div>

    <!-- 콜아웃 라벨 -->
    <div class="co co-sidebar">
      <div class="line"></div><div class="dot"></div>
      <div class="label">앱 카테고리 메뉴</div>
    </div>
    <div class="co co-topbar">
      <div class="line"></div><div class="dot"></div>
      <div class="label">전역 검색 · 서버 상태</div>
    </div>
    <div class="co co-overview">
      <div class="line"></div><div class="dot"></div>
      <div class="label">사용자 · 서버 컨텍스트</div>
    </div>
    <div class="co co-cards">
      <div class="line"></div><div class="dot"></div>
      <div class="label">서비스 현황 지표</div>
    </div>
    <div class="co co-favorites">
      <div class="line"></div><div class="dot"></div>
      <div class="label">자주 쓰는 앱 바로가기</div>
    </div>
    <div class="co co-history">
      <div class="line"></div><div class="dot"></div>
      <div class="label">해석 이력 · 다운로드</div>
    </div>
  </div>

  <div class="stack">
    <div class="stack-rule"></div>
    <div class="stack-text">Electron · React · FastAPI · MySQL · MSC Nastran</div>
  </div>

</div>
</body>
</html>
