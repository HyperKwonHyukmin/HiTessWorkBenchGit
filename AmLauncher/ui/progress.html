<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>HiTESS Model Builder</title>
<style>
  :root {
    --brand: #002554;
    --text: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --track: #F1F5F9;
    --ok: #15803D;
    --danger: #B91C1C;
    --danger-bg: #FEF2F2;
    --danger-line: #FECACA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #FFFFFF; color: var(--text);
    font: 13px/1.5 'Malgun Gothic', 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  header { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  .product { font-size: 11px; color: var(--muted); letter-spacing: 0; }
  h1 { margin: 2px 0 0; font-size: 16px; font-weight: 700; color: var(--brand); }
  .sub { margin-top: 2px; font-size: 12px; color: var(--muted); word-break: break-all; }
  main { flex: 1; padding: 14px 22px 8px; overflow: auto; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; padding: 6px 0; align-items: start; }
  .dot { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--line); background: #FFFFFF; }
  li.active .dot { border-color: var(--brand); background: var(--brand); }
  li.done .dot { border-color: var(--ok); background: var(--ok); }
  li.error .dot { border-color: var(--danger); background: var(--danger); }
  .label { color: var(--muted); }
  li.active .label { color: var(--text); font-weight: 700; }
  li.done .label { color: var(--text); }
  li.error .label { color: var(--danger); font-weight: 700; }
  .detail { grid-column: 2; font-size: 11px; color: var(--muted); word-break: break-all; }
  .bar { height: 6px; margin: 12px 0 4px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--brand); transition: width .3s ease; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate > div { animation: none; width: 100%; opacity: .35; } }
  .message { font-size: 12px; color: var(--muted); min-height: 18px; word-break: break-all; }
  .error { display: none; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--danger-line);
    background: var(--danger-bg); border-radius: 6px; color: var(--danger); font-size: 12px;
    white-space: pre-wrap; word-break: break-all; -webkit-user-select: text; user-select: text; max-height: 120px; overflow: auto; }
  .info { display: none; margin-top: 10px; font-size: 12px; color: var(--text); word-break: break-all;
    -webkit-user-select: text; user-select: text; }
  .info .k { color: var(--muted); }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 16px; border-top: 1px solid var(--line); }
  footer:empty { display: none; }
  button { font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #FFFFFF; color: var(--text); }
  button:hover { border-color: #CBD5E1; background: #F8FAFC; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
  button.primary:hover { background: #00337A; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <div class="product">HiTESS Model Builder</div>
    <h1 id="title">준비 중</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <main>
    <ol id="steps"></ol>
    <div class="bar" id="bar"><div></div></div>
    <div class="message" id="message" aria-live="polite"></div>
    <div class="error" id="error" role="alert"></div>
    <div class="info" id="info"></div>
  </main>
  <footer id="actions"></footer>
<script>
  const $ = (id) => document.getElementById(id);
  function render(s) {
    $("title").textContent = s.title || "";
    $("subtitle").textContent = s.subtitle || "";
    document.title = s.title ? `${s.title} — HiTESS Model Builder` : "HiTESS Model Builder";

    const ol = $("steps");
    ol.textContent = "";
    for (const step of s.steps || []) {
      const li = document.createElement("li");
      li.className = step.status || "pending";
      const dot = document.createElement("span"); dot.className = "dot";
      const label = document.createElement("span"); label.className = "label"; label.textContent = step.label;
      li.appendChild(dot); li.appendChild(label);
      if (step.detail) {
        const d = document.createElement("span"); d.className = "detail"; d.textContent = step.detail;
        li.appendChild(d);
      }
      ol.appendChild(li);
    }

    const bar = $("bar");
    const fill = bar.firstElementChild;
    if (s.progress === null || s.progress === undefined) {
      bar.style.display = s.busy ? "block" : "none";
      bar.classList.add("indeterminate");
      fill.style.width = "";
    } else {
      bar.style.display = "block";
      bar.classList.remove("indeterminate");
      fill.style.width = `${Math.max(0, Math.min(100, s.progress))}%`;
    }

    $("message").textContent = s.message || "";
    const err = $("error");
    err.style.display = s.error ? "block" : "none";
    err.textContent = s.error || "";

    const info = $("info");
    info.textContent = "";
    info.style.display = (s.info && s.info.length) ? "block" : "none";
    for (const row of s.info || []) {
      const div = document.createElement("div");
      const k = document.createElement("span"); k.className = "k"; k.textContent = `${row.label} `;
      const v = document.createElement("span"); v.textContent = row.value;
      div.appendChild(k); div.appendChild(v);
      info.appendChild(div);
    }

    const footer = $("actions");
    footer.textContent = "";
    for (const a of s.actions || []) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = a.label;
      if (a.primary) b.className = "primary";
      b.addEventListener("click", () => window.launcherUI.action(a.id));
      footer.appendChild(b);
    }
    const primary = footer.querySelector("button.primary");
    if (primary) primary.focus();
  }
  window.launcherUI.onState(render);
  window.launcherUI.ready();
</script>
</body>
</html>
