<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src http: https:; img-src 'self' data:">
<title>HiTESS 영상</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e2e8f0; overflow: hidden;
    font-family: "SUIT", "Malgun Gothic", system-ui, sans-serif; user-select: none; }
  #stage { position: relative; width: 100%; height: 100%; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  /* 워터마크 — 재생을 가리지 않을 만큼 옅게, 그러나 찍히면 읽히게. 클릭은 영상으로 통과시킨다. */
  .mark { position: absolute; pointer-events: none; white-space: nowrap; font-weight: 700;
    color: rgba(255, 255, 255, 0.22); text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
    transition: left 1.2s ease, top 1.2s ease; }
  #roam { font-size: 22px; }
  #corner { right: 16px; top: 12px; font-size: 13px; color: rgba(255, 255, 255, 0.35); }
  #fs { position: absolute; right: 14px; bottom: 58px; padding: 6px 10px; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; background: rgba(15, 23, 42, 0.6); color: #e2e8f0; font-size: 12px; font-weight: 700;
    cursor: pointer; opacity: 0; transition: opacity 0.2s; }
  #stage:hover #fs, #fs:focus-visible { opacity: 1; }
  #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 15px; line-height: 1.6; background: #000; white-space: pre-line; }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" controls autoplay playsinline
      controlslist="nodownload nofullscreen noremoteplayback noplaybackrate"
      disablepictureinpicture disableremoteplayback></video>
    <div id="roam" class="mark" aria-hidden="true"></div>
    <div id="corner" class="mark" aria-hidden="true"></div>
    <button id="fs" type="button">전체 화면</button>
    <div id="message" role="alert"></div>
  </div>
  <script src="video-player.js"></script>
</body>
</html>
