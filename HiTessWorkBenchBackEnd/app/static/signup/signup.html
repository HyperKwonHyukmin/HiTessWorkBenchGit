<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HiTESS WorkBench 가입</title>
<!--
  AM 연동 클라이언트(HiTessMB.exe)가 미가입 사번일 때 브라우저로 여는 가입 페이지. GET /signup?employee_id=…
  WorkBench 앱 없이 가입하게 하려는 것 — 가입 처리는 앱과 같은 POST /api/register(관리자 승인 유지).
  선택지는 WorkBench RegisterModal.jsx 의 BASE_COMPANIES·BASE_DEPARTMENTS·BASE_POSITIONS 사본이다(한쪽 고치면 양쪽 다).
  같은 서버가 주는 페이지라 CORS 무관, 외부 리소스 없음.
-->
<style>
  :root {
    --brand: #002554; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --bg: #f8fafc; --good: #15803d; --bad: #b91c1c; --focus: rgba(0, 37, 84, .15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 Inter, SUIT, system-ui, sans-serif;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  header { padding: 28px 28px 20px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  h1 { margin: 4px 0 6px; font-size: 21px; color: var(--brand); }
  header p { margin: 0; font-size: 13.5px; color: var(--muted); }
  form, .done { padding: 22px 28px 28px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  label .hint { font-weight: 400; color: var(--muted); margin-left: 6px; }
  input {
    width: 100%; height: 42px; padding: 0 12px; font: inherit; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus); }
  input[aria-invalid="true"] { border-color: var(--bad); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row label { margin-top: 14px; }
  .msg { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--bad); }
  button {
    width: 100%; height: 44px; margin-top: 14px; border: 0; border-radius: 8px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: default; }
  .note { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); }
  .done { display: none; }
  .done h2 { margin: 0 0 8px; font-size: 18px; color: var(--good); }
  .done p { margin: 0 0 8px; color: var(--ink); }
  .done ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">HiTESS Model Builder · Aveva Marine 연동</div>
    <h1>HiTESS WorkBench 가입</h1>
    <p>처음 쓰는 사번입니다. 가입 신청 후 관리자가 승인하면 AM 에서 다시 실행할 수 있습니다.</p>
  </header>

  <form id="form" novalidate>
    <label for="employee_id">사번 <span class="hint">영문 1자 + 숫자 5~7자리</span></label>
    <input id="employee_id" name="employee_id" autocomplete="off" maxlength="8" placeholder="A123456" required>

    <label for="name">이름</label>
    <input id="name" name="name" autocomplete="name" maxlength="50" placeholder="홍길동" required>

    <label for="company">회사 <span class="hint">목록에 없으면 직접 입력</span></label>
    <input id="company" name="company" list="companies" maxlength="50" value="HD 현대중공업" required>

    <div class="row">
      <div>
        <label for="department">부서</label>
        <input id="department" name="department" list="departments" maxlength="50" required>
      </div>
      <div>
        <label for="position">직급</label>
        <input id="position" name="position" list="positions" maxlength="50" value="책임엔지니어" required>
      </div>
    </div>

    <datalist id="companies">
      <option value="HD 현대중공업"><option value="HD 현대삼호"><option value="HD 한국조선해양">
    </datalist>
    <datalist id="departments">
      <option value="건조기술기획부"><option value="구조시스템연구실"><option value="기장설계부"><option value="미래기술개발부">
      <option value="선각기술설계부"><option value="선장설계부"><option value="선체설계부"><option value="운항관제부">
    </datalist>
    <datalist id="positions">
      <option value="책임연구원"><option value="책임엔지니어"><option value="선임연구원">
      <option value="선임엔지니어"><option value="연구원"><option value="엔지니어">
    </datalist>

    <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    <button type="submit" id="submit">가입 신청</button>
    <p class="note">가입 정보는 HiTESS WorkBench 와 같이 쓰입니다.</p>
  </form>

  <section class="done" id="done" aria-live="polite">
    <h2>가입 신청을 받았습니다</h2>
    <p id="doneText"></p>
    <ol>
      <li>관리자가 승인하면 사용할 수 있습니다.</li>
      <li>승인 후 AM 에서 [구조해석 모델] 버튼을 다시 누르세요.</li>
    </ol>
  </section>
</main>
<script>
(function () {
  var EMPLOYEE_RE = /^[A-Z]\d{5,7}$/;
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var submit = document.getElementById('submit');
  var fields = ['employee_id', 'name', 'company', 'department', 'position'];
  var input = function (id) { return document.getElementById(id); };

  var preset = new URLSearchParams(location.search).get('employee_id');
  if (preset) input('employee_id').value = preset.trim().toUpperCase();
  input(preset ? 'name' : 'employee_id').focus();

  input('employee_id').addEventListener('input', function (e) {
    e.target.value = e.target.value.toUpperCase().replace(/\s/g, '');
  });

  function fail(text, fieldId) {
    msg.textContent = text;
    fields.forEach(function (id) { input(id).removeAttribute('aria-invalid'); });
    if (fieldId) { input(fieldId).setAttribute('aria-invalid', 'true'); input(fieldId).focus(); }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = {};
    for (var i = 0; i < fields.length; i++) {
      var id = fields[i];
      data[id] = input(id).value.trim();
      if (!data[id]) return fail(input(id).labels[0].firstChild.textContent.trim() + '을(를) 입력해 주세요.', id);
    }
    data.employee_id = data.employee_id.toUpperCase();
    if (!EMPLOYEE_RE.test(data.employee_id)) return fail('사번 형식이 올바르지 않습니다(예: A123456).', 'employee_id');

    fail('');
    submit.disabled = true;
    submit.textContent = '보내는 중…';
    fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) { return { res: res, body: body }; });
    }).then(function (r) {
      if (r.res.ok) {
        form.style.display = 'none';
        document.getElementById('doneText').textContent = data.name + ' (' + data.employee_id + ') 님의 가입 신청을 받았습니다.';
        document.getElementById('done').style.display = 'block';
        return;
      }
      var detail = r.body && r.body.detail;
      if (r.res.status === 400 && detail === 'Employee ID already registered') {
        fail('이미 가입된 사번입니다. 승인을 기다리는 중이면 관리자에게 문의해 주세요.', 'employee_id');
      } else if (r.res.status === 422) {
        fail('입력값 형식이 올바르지 않습니다. 사번과 각 칸을 확인해 주세요.', detail === 'invalid_employee_id_format' ? 'employee_id' : null);
      } else {
        fail('가입 신청을 보내지 못했습니다(HTTP ' + r.res.status + '). 잠시 후 다시 시도해 주세요.');
      }
    }).catch(function () {
      fail('서버에 연결하지 못했습니다. 사내망 연결을 확인해 주세요.');
    }).then(function () {
      submit.disabled = false;
      submit.textContent = '가입 신청';
    });
  });
})();
</script>
</body>
</html>
